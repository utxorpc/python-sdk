# Dependabot version updates. Configuration reference:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # Dependabot reads Poetry projects (pyproject.toml + poetry.lock) through pip.
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
