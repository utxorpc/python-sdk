name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # On-demand trigger: GitHub refuses to re-run a run older than 30 days.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: poetry
      # Fail if poetry.lock is stale vs pyproject.toml; install what is committed.
      - run: poetry check --lock
      - run: poetry install
      - run: poetry build

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pipx install poetry
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: poetry
      # Fail if poetry.lock is stale vs pyproject.toml; install what is committed.
      - run: poetry check --lock
      - run: poetry install
      # No pytest suite yet; import-smoke the built package so CI fails fast
      # on broken codegen/spec dependencies.
      - run: poetry run python -c "import utxorpc"
